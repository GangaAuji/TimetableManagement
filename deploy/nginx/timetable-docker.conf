# Nginx in front of the Docker web container. The React build answers page loads.
# /api, /health, and Flask static files go to gunicorn.
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://web:8000;
        include /etc/nginx/timetable-proxy.conf;
    }

    location = /health {
        proxy_pass http://web:8000;
        include /etc/nginx/timetable-proxy.conf;
        access_log off;
    }

    location /static/ {
        proxy_pass http://web:8000;
        include /etc/nginx/timetable-proxy.conf;
    }

    location = /logout {
        proxy_pass http://web:8000;
        include /etc/nginx/timetable-proxy.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
