# nginx site for Timetable Management. One server block serves every college: the Host header reaches
# the app unchanged and selects the tenant. Add every college hostname to server_name (or use a wildcard)
# and to the certificate. Replace timetable.example and the certificate paths.

upstream timetable_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

# Sign-in attempts are also limited in the app; this is the coarse edge limit.
limit_req_zone $binary_remote_addr zone=timetable_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=timetable_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name timetable.example *.timetable.example;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timetable.example *.timetable.example;

    ssl_certificate     /etc/letsencrypt/live/timetable.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timetable.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:timetable_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 25m;
    access_log /var/log/nginx/timetable.access.log;
    error_log  /var/log/nginx/timetable.error.log;

    # Built React app and static files are served by nginx; everything else goes to gunicorn.
    root /opt/timetable/app/static;
    location /static/ {
        alias /opt/timetable/app/static/;
        expires 7d;
        access_log off;
    }
    location = /favicon.ico { try_files /favicon.png =404; }

    location = /health {
        proxy_pass http://timetable_app;
        include /etc/nginx/snippets/timetable-proxy.conf;
        access_log off;
    }

    location ~ ^/(login|admin/login)$ {
        limit_req zone=timetable_login burst=10 nodelay;
        proxy_pass http://timetable_app;
        include /etc/nginx/snippets/timetable-proxy.conf;
    }

    location /api/ {
        limit_req zone=timetable_api burst=40 nodelay;
        proxy_pass http://timetable_app;
        include /etc/nginx/snippets/timetable-proxy.conf;
    }

    location / {
        proxy_pass http://timetable_app;
        include /etc/nginx/snippets/timetable-proxy.conf;
    }
}
