{% extends "admin/_layout.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="text-center max-w-lg">
        <div class="mb-8">
            <i class="fas fa-exclamation-triangle text-9xl text-orange-300"></i>
        </div>
        <h1 class="text-6xl font-bold text-gray-800 mb-4">500</h1>
        <h2 class="text-2xl font-bold text-gray-700 mb-4">Internal Server Error</h2>
        <p class="text-gray-500 mb-4">
            Something went wrong on our end. We're working to fix the issue.
        </p>
        {% if error %}
        <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-8 text-left">
            <p class="text-xs font-mono text-red-700">{{ error }}</p>
        </div>
        {% endif %}
        <div class="flex gap-4 justify-center">
            <a href="{{ url_for('admin.dashboard') }}" class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                <i class="fas fa-home mr-2"></i>Go to Dashboard
            </a>
            <button onclick="location.reload()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
                <i class="fas fa-redo mr-2"></i>Try Again
            </button>
        </div>
    </div>
</div>
{% endblock %}
