{% extends "admin/_layout.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="text-center max-w-lg">
        <div class="mb-8">
            <i class="fas fa-search text-9xl text-gray-300"></i>
        </div>
        <h1 class="text-6xl font-bold text-gray-800 mb-4">404</h1>
        <h2 class="text-2xl font-bold text-gray-700 mb-4">Page Not Found</h2>
        <p class="text-gray-500 mb-8">
            Sorry, the page you're looking for doesn't exist or has been moved.
        </p>
        <div class="flex gap-4 justify-center">
            <a href="{{ url_for('admin.dashboard') }}" class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                <i class="fas fa-home mr-2"></i>Go to Dashboard
            </a>
            <button onclick="history.back()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
