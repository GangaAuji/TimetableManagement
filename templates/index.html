<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ branding.site_title or 'College Timetable System' }}</title>
    {% if branding.favicon %}
    <link rel="icon" type="image/png" href="{{ url_for('static', filename=branding.favicon) }}">
    {% endif %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .hero {
            background: linear-gradient(to right, {{ branding.primary_color or '#6a11cb' }}, {{ branding.secondary_color or '#2575fc' }});
            color: white;
            padding: 5rem 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="container">
            <h1 class="display-4">Welcome to the {{ institution_name or 'College Timetable Management System' }}</h1>
            <p class="lead">Efficiently manage and view schedules for students, teachers, and admins.</p>
            <a href="{{ url_for('auth.login') }}" class="btn btn-light btn-lg">Login to Get Started</a>
        </div>
    </div>
</body>
</html>
