<footer class="mt-auto border-t border-gray-200 bg-white/95 backdrop-blur-sm">
    <div class="py-4 px-4 lg:px-4 xl:px-6">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div class="flex items-center gap-3">
                <div class="h-8 w-8 rounded-lg border flex items-center justify-center {{ footer_icon_bg }} {{ footer_icon_border }} {{ footer_icon_color }}">
                    <i class="fas {{ footer_icon_class }} text-sm"></i>
                </div>
                <div class="leading-tight">
                    <p class="text-sm font-semibold text-gray-800">{{ footer_title }}</p>
                    <p class="text-xs text-gray-500">
                        {{ footer_caption_before_year | safe }} <span data-footer-year></span> {{ footer_caption_after_year }}
                    </p>
                </div>
            </div>
            <div class="text-xs sm:text-sm text-gray-500 md:text-right">
                <span class="inline-flex items-center px-3 py-1 rounded-full border border-gray-200 bg-gray-50">
                    <i class="fas {{ footer_pill_icon_class }} {{ footer_pill_icon_color }} mr-2"></i>
                    {{ footer_pill_text }}
                </span>
            </div>
        </div>
    </div>
</footer>
