{% extends "teacher/_layout.html" %}

{% block title %}Request Proxy{% endblock %}
{% block header_title %}Request Proxy{% endblock %}

{% block content %}
<div class="bg-white p-6 rounded-lg shadow-md">
    <h3 class="text-lg font-semibold text-gray-700 mb-4">Submit a Proxy Request</h3>
    <form method="POST" action="{{ url_for('teacher.request_proxy') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Lecture</label>
                <select name="timetable_id" class="w-full border rounded px-3 py-2" required>
                    <option value="" disabled selected>Select a lecture</option>
                    {% for tid, day, st, et, subj in lectures %}
                    <option value="{{ tid }}">{{ day }} • {{ st|format_time_12hr }}-{{ et|format_time_12hr }} • {{ subj }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Preferred Proxy (optional)</label>
                <select name="proxy_faculty_id" class="w-full border rounded px-3 py-2">
                    <option value="">No preference</option>
                    {% for sid, proxies in proxy_map.items() %}
                    <optgroup label="Subject ID {{ sid }}">
                        {% for p in proxies %}
                        <option value="{{ p.faculty_id }}">{{ p.name }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Absence Date</label>
                <input type="date" name="absence_date" class="w-full border rounded px-3 py-2" required>
            </div>
        </div>
        <div class="mt-6">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                Submit Request
            </button>
            <a href="{{ url_for('teacher.proxy_requests') }}" class="ml-3 text-blue-700 hover:underline text-sm">View my
                proxy log</a>
        </div>
    </form>
</div>
{% endblock %}
